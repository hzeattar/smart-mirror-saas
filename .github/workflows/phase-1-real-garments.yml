name: Phase 1 Real Garments Validation

on:
  push:
    branches:
      - phase-2-real-garments-smart-ui
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cv-client-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cv_client/requirements-ci.txt

      - name: Install lightweight test dependencies
        id: python_install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cv_client/requirements-ci.txt

      - name: Compile Python sources
        id: python_compile
        continue-on-error: true
        run: python -m compileall -q cv_client

      - name: Run CV client unit tests
        id: python_tests
        continue-on-error: true
        env:
          PYTHONPATH: cv_client
        run: python -m unittest discover -s cv_client/tests -p 'test_*.py' -v

      - name: Set up PHP 8.3
        id: php_setup
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint photographic catalog seeder
        id: photo_seeder_lint
        continue-on-error: true
        run: php -l database/seeders/PhotographicGarmentCatalogSeeder.php

      - name: Lint database seeder
        id: database_seeder_lint
        continue-on-error: true
        run: php -l database/seeders/DatabaseSeeder.php

      - name: Report validation outcomes
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- phase-1-validation-report -->';
            const body = `${marker}\n## Phase 1 validation report\n\n` +
              `| Check | Outcome |\n|---|---|\n` +
              `| Python dependencies | ${{ steps.python_install.outcome }} |\n` +
              `| Python compile | ${{ steps.python_compile.outcome }} |\n` +
              `| Python unit tests | ${{ steps.python_tests.outcome }} |\n` +
              `| PHP setup | ${{ steps.php_setup.outcome }} |\n` +
              `| Photographic seeder lint | ${{ steps.photo_seeder_lint.outcome }} |\n` +
              `| Database seeder lint | ${{ steps.database_seeder_lint.outcome }} |\n`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(comment => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce validation gate
        if: always()
        env:
          PYTHON_INSTALL: ${{ steps.python_install.outcome }}
          PYTHON_COMPILE: ${{ steps.python_compile.outcome }}
          PYTHON_TESTS: ${{ steps.python_tests.outcome }}
          PHP_SETUP: ${{ steps.php_setup.outcome }}
          PHOTO_SEEDER_LINT: ${{ steps.photo_seeder_lint.outcome }}
          DATABASE_SEEDER_LINT: ${{ steps.database_seeder_lint.outcome }}
        run: |
          test "$PYTHON_INSTALL" = success
          test "$PYTHON_COMPILE" = success
          test "$PYTHON_TESTS" = success
          test "$PHP_SETUP" = success
          test "$PHOTO_SEEDER_LINT" = success
          test "$DATABASE_SEEDER_LINT" = success
