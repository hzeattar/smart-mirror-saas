name: Phase 1 Real Garments Validation

on:
  push:
    branches:
      - phase-2-real-garments-smart-ui
  pull_request:
    branches:
      - main

jobs:
  cv-client-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cv_client/requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee pip-upgrade.log
          python -m pip install -r cv_client/requirements.txt 2>&1 | tee pip-install.log

      - name: Compile Python sources
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q cv_client 2>&1 | tee python-compile.log

      - name: Run CV client unit tests
        shell: bash
        env:
          PYTHONPATH: cv_client
        run: |
          set -o pipefail
          python -m unittest discover -s cv_client/tests -p 'test_*.py' -v 2>&1 | tee python-tests.log

      - name: Lint photographic catalog seeder
        run: php -l database/seeders/PhotographicGarmentCatalogSeeder.php

      - name: Lint database seeder
        run: php -l database/seeders/DatabaseSeeder.php

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-validation-logs
          if-no-files-found: ignore
          path: |
            pip-upgrade.log
            pip-install.log
            python-compile.log
            python-tests.log
