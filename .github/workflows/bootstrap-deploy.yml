# Triggered after all source parts were uploaded.
name: Materialize project source

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/source.part.*'
      - '.github/workflows/bootstrap-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-project-source
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/source.part.00
          test -f .bootstrap/source.part.01
          test -f .bootstrap/source.part.02
          test -f .bootstrap/source.part.03
          test -f .bootstrap/source.part.04
          test -f .bootstrap/source.part.05
          test -f .bootstrap/source.part.06
          test -f .bootstrap/source.part.07
          cat .bootstrap/source.part.00 \
              .bootstrap/source.part.01 \
              .bootstrap/source.part.02 \
              .bootstrap/source.part.03 \
              .bootstrap/source.part.04 \
              .bootstrap/source.part.05 \
              .bootstrap/source.part.06 \
              .bootstrap/source.part.07 > /tmp/smart-mirror-source.tar.gz.b64
          base64 --decode /tmp/smart-mirror-source.tar.gz.b64 > /tmp/smart-mirror-source.tar.gz
          echo 'cfe72a46401b7e62c40afb96db58609feeadc79ef99cf36a9e2abf658c4569eb  /tmp/smart-mirror-source.tar.gz' | sha256sum --check

      - name: Materialize repository files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-deploy.yml
          tar --extract --gzip --file=/tmp/smart-mirror-source.tar.gz --directory=.
          test -f artisan
          test -f composer.json
          test -f Dockerfile
          test -f railway.json
          test -f app/Models/Tenant.php
          test -f resources/js/App.vue
          test -f cv_client/main.py

      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Complete smart mirror SaaS platform'
          git push origin HEAD:main
