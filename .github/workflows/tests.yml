name: Tests
on:
  push:
  pull_request:

jobs:
  laravel:
    runs-on: ubuntu-latest
    strategy:
      matrix: { php: ['8.3', '8.4'] }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: mbstring, pdo_sqlite, fileinfo, intl, coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: composer install --no-interaction --prefer-dist
      - run: npm install
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan test
      - run: vendor/bin/pint --test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cv_client/requirements-ci.txt
      - name: Install lightweight CV test dependencies
        run: python -m pip install -r cv_client/requirements-ci.txt
      - name: Compile CV client
        run: python -m compileall -q cv_client
      - name: Run CV client tests
        env:
          PYTHONPATH: cv_client
        run: python -m unittest discover -s cv_client/tests -p 'test_*.py' -v

  nvidia-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/nvidia-nim-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Test gateway
        run: go test ./...
      - name: Vet gateway
        run: go vet ./...
      - name: Build gateway container
        run: docker build --tag smart-mirror-nvidia-gateway:ci .

  garment-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/garment-processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/garment-processor/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: pytest -q
      - run: docker build --tag smart-mirror-garment-processor:ci .
