name: Tests
on:
  push:
  pull_request:

jobs:
  laravel:
    runs-on: ubuntu-latest
    strategy:
      matrix: { php: ['8.3', '8.4'] }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: mbstring, pdo_sqlite, fileinfo, intl, coverage: none }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: composer install --no-interaction --prefer-dist
      - run: npm install
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: touch database/database.sqlite
      - run: php artisan test
      - run: vendor/bin/pint --test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cv_client/requirements.txt
      - name: Install CV client dependencies
        run: python -m pip install -r cv_client/requirements.txt
      - name: Compile CV client
        run: python -m compileall -q cv_client
      - name: Run CV client tests
        env:
          PYTHONPATH: cv_client
        run: python -m unittest discover -s cv_client/tests -p 'test_*.py' -v
